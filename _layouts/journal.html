<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/journal.css' | relative_url }}">
  <script src="{{ '/assets/js/journal.js' | relative_url }}" defer></script>
  {% if page.math %}<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js" id="MathJax-script"></script>{% endif %}
</head>
<body class="journal-site">
  <a class="skip-link" href="#main-content"><span data-lang="zh">跳到正文</span><span data-lang="en" hidden>Skip to content</span></a>
  <header class="journal-header">
    <a class="journal-brand" href="{{ '/' | relative_url }}" aria-label="Qiang Xu home"><span class="brand-mark">QX<span>.</span></span><span>Qiang Xu</span></a>
    <nav class="journal-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}><span data-lang="zh">首页</span><span data-lang="en" hidden>Home</span></a>
      <a href="{{ '/year-archive/' | relative_url }}" {% if page.url == '/year-archive/' %}aria-current="page"{% endif %}><span data-lang="zh">文章</span><span data-lang="en" hidden>Writing</span></a>
      <div class="language-switch" role="group" aria-label="Language / 语言">
        <button type="button" data-set-language="zh" aria-pressed="true">中文</button>
        <button type="button" data-set-language="en" aria-pressed="false">EN</button>
      </div>
    </nav>
  </header>
  <main id="main-content" class="journal-main" tabindex="-1">{{ content }}</main>
  <footer class="journal-footer">
    <span>© {{ 'now' | date: '%Y' }} Qiang Xu</span>
    <span data-lang="zh">在实践中学习，在记录中思考。</span><span data-lang="en" hidden>Learning by building. Thinking through writing.</span>
    <a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a>
  </footer>
</body>
</html>
