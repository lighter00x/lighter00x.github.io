<div class="writing-list">
  {% for post in site.posts %}
  <article class="writing-row">
    <div class="writing-date"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%m.%d' }}</time><span>{{ post.date | date: '%Y' }}</span></div>
    <div class="writing-content">
      <div class="writing-label"><span class="topic-dot"></span><span data-lang="zh">实践笔记</span><span data-lang="en" hidden>FIELD NOTES · ZH</span></div>
      <h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>
      <p>{{ post.excerpt | strip_html | truncate: 105 }}</p>
      <div class="writing-tags">{% for tag in post.tags %}<span>{{ tag }}</span>{% endfor %}</div>
    </div>
    <a class="writing-arrow" href="{{ post.url | relative_url }}" aria-label="{{ post.title | escape }}">↗</a>
  </article>
  {% endfor %}
</div>
